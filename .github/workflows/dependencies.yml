{
  "name": "Dependency checks",
  "on": {
    "push": {},
    "pull_request": {},
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "dependency-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "dependency-gate": {
      "name": "Dependency gate",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "env": {
        "NEXT_TELEMETRY_DISABLED": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        },
        {
          "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38",
          "with": {
            "node-version": "24"
          }
        },
        {
          "uses": "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6",
          "with": {
            "bun-version": "1.4.3"
          }
        },
        {
          "run": "npm ci"
        },
        {
          "run": "npm run test:security && npm audit --audit-level=low"
        },
        {
          "run": "npm run build"
        },
        {
          "name": "Build and exercise the deployment image",
          "run": "docker build --pull -t dependency-check .\ndocker run -d --name dependency-check --memory 1g --cpus 1 -p 127.0.0.1:3014:3000 dependency-check\ntrap 'docker logs dependency-check; docker rm -f dependency-check' EXIT\ncurl --fail --silent --show-error --max-time 10 --retry 20 --retry-all-errors --retry-delay 1 \"http://127.0.0.1:3014/\" --output /tmp/app-response.html"
        }
      ]
    },
    "verified-release-receipt": {
      "name": "Verified release receipt",
      "needs": "dependency-gate",
      "if": "(github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == github.event.repository.default_branch",
      "runs-on": "ubuntu-latest",
      "permissions": {
        "contents": "write"
      },
      "env": {
        "GH_TOKEN": "${{ github.token }}",
        "GH_REPO": "${{ github.repository }}",
        "COMMIT": "${{ github.sha }}"
      },
      "steps": [
        {
          "name": "Record the exact successful default-branch commit",
          "run": "set -eu\ncase \"$COMMIT\" in *[!a-f0-9]*|'') exit 1;; esac\n[ \"${#COMMIT}\" -eq 40 ]\nref=\"homelab-verified-$COMMIT\"\nexisting=$(gh api \"repos/$GH_REPO/git/matching-refs/tags/$ref\" --jq \".[] | select(.ref == \\\"refs/tags/$ref\\\") | .object.sha\")\nif [ \"$existing\" = \"$COMMIT\" ]; then exit 0; fi\n[ -z \"$existing\" ]\ngh api --method POST \"repos/$GH_REPO/git/refs\" -f \"ref=refs/tags/$ref\" -f \"sha=$COMMIT\"\n"
        }
      ]
    }
  }
}
